<div class="cert-modal">
  <div class="cert-head">
    <h2>Certificado</h2>
    <a *ngIf="url" [href]="url" target="_blank" rel="noopener" title="Verificar credencial">
      <i class="fas fa-arrow-up-right-from-square"></i>
    </a>
  </div>
  <div class="cert-img">
    <img [src]="img" alt="Certificado">
  </div>
</div>
