<section class="section-pad" id="projects">
  <div class="container">
    <div class="section-head" scrollReveal>
      <span class="section-kicker"><span>04.</span> Portafolio</span>
      <h2 class="section-title">Proyectos <span class="accent-text">destacados</span></h2>
      <p class="section-sub">Una selección de productos y plataformas que he construido.</p>
    </div>

    <div class="projects-grid">
      <article class="project-card" *ngFor="let project of projects; let i = index"
               [class.featured]="project.featured" scrollReveal [revealDelay]="(i % 2) * 120">

        <!-- Media -->
        <div class="project-media">
          <span class="badge" *ngIf="project.featured"><i class="fas fa-star"></i> Destacado</span>

          <!-- Screenshot -->
          <div class="browser" *ngIf="project.images?.length">
            <div class="browser-bar">
              <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
              <span class="browser-url"><i class="fas fa-lock"></i> {{ project.name | lowercase }}.app</span>
              <button class="expand" title="Ampliar"
                      (click)="openLightbox(project.images![activeImage[i] || 0])">
                <i class="fas fa-expand"></i>
              </button>
            </div>
            <div class="browser-screen">
              <img [src]="project.images![activeImage[i] || 0]" [alt]="project.name">
            </div>
            <div class="thumbs" *ngIf="project.images!.length > 1">
              <button *ngFor="let img of project.images; let j = index"
                      class="thumb" [class.active]="(activeImage[i] || 0) === j"
                      (click)="setImage(i, j)">
                <img [src]="img" alt="">
              </button>
            </div>
          </div>

          <!-- Cover (no screenshot) -->
          <div class="cover" *ngIf="!project.images?.length && project.cover"
               [style.background]="project.cover.gradient">
            <i class="{{ project.cover.icon }}"></i>
          </div>
        </div>

        <!-- Body -->
        <div class="project-body">
          <p class="project-cat">{{ project.category }} · {{ project.year }}</p>
          <h3 class="project-name">{{ project.name }}</h3>
          <p class="project-role"><i class="fas fa-user-tie"></i> {{ project.role }}</p>
          <p class="project-desc">{{ project.description }}</p>

          <div class="metrics">
            <span class="metric" *ngFor="let m of project.metrics">{{ m }}</span>
          </div>

          <div class="tools">
            <img *ngFor="let tool of project.tools" [src]="tool[0]" [title]="tool[1]" [alt]="tool[1]">
          </div>

          <div class="project-actions">
            <a *ngIf="project.github" [href]="project.github" target="_blank" rel="noopener" class="act">
              <i class="fab fa-github"></i> Código
            </a>
            <a *ngIf="project.url" [href]="project.url" target="_blank" rel="noopener" class="act act-primary">
              <i class="fas fa-arrow-up-right-from-square"></i> Ver proyecto
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" *ngIf="lightboxSrc" (click)="closeLightbox()">
  <button class="lightbox-close" (click)="closeLightbox()"><i class="fas fa-times"></i></button>
  <img [src]="lightboxSrc" alt="" (click)="$event.stopPropagation()">
</div>
