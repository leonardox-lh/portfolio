<section class="section-pad" id="tools">
  <div class="container">
    <div class="section-head center" scrollReveal>
      <span class="section-kicker"><span>03.</span> Stack técnico</span>
      <h2 class="section-title">Herramientas &amp; <span class="accent-text">tecnologías</span></h2>
      <p class="section-sub">El conjunto con el que diseño, construyo y despliego.</p>
    </div>

    <div class="skills-grid">
      <div class="skill-card" *ngFor="let group of groups; let i = index"
           scrollReveal [revealDelay]="i * 90">
        <div class="skill-card-head">
          <span class="skill-ico"><i class="{{ group.icon }}"></i></span>
          <div>
            <h3>{{ group.title }}</h3>
            <p>{{ group.desc }}</p>
          </div>
        </div>
        <div class="chips">
          <span class="chip" *ngFor="let s of group.skills">
            <img *ngIf="s.img" [src]="s.img" [alt]="s.name">
            <i *ngIf="s.icon" class="{{ s.icon }}"></i>
            {{ s.name }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
